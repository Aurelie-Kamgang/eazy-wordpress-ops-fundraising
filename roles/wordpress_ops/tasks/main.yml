---
- name: "WordPress Ops | Check target"
  ansible.builtin.include_tasks: check.yml
  tags:
    - check

- name: "WordPress Ops | Update plugins"
  ansible.builtin.include_tasks: update_plugins.yml
  tags:
    - update_plugins

- name: "WordPress Ops | Prepare S3"
  ansible.builtin.include_tasks: s3_setup.yml
  when: s3_upload_enabled | bool
  tags:
    - backup_db
    - backup_files
    - backup_full
    - s3_setup
    - upload_s3

- name: "WordPress Ops | Backup database"
  ansible.builtin.include_tasks: backup_db.yml
  tags:
    - backup_db
    - backup_full

- name: "WordPress Ops | Backup site files"
  ansible.builtin.include_tasks: backup_files.yml
  tags:
    - backup_files
    - backup_full

- name: "WordPress Ops | Restore database"
  ansible.builtin.include_tasks: restore_db.yml
  tags:
    - restore_db
    - restore_full

- name: "WordPress Ops | Restore site files"
  ansible.builtin.include_tasks: restore_files.yml
  tags:
    - restore_files
    - restore_full

- name: "WordPress Ops | Prepare S3 backup storage"
  ansible.builtin.include_tasks: s3_setup.yml
  tags:
    - s3_setup
    - upload_s3
    - backup_db
    - backup_files
    - backup_full