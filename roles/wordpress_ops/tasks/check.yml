---
- name: "Check | Show execution context"
  ansible.builtin.debug:
    msg:
      - "Host Ansible : {{ inventory_hostname }}"
      - "Utilisateur distant : {{ ansible_user_id }}"
      - "HOME distant : {{ ansible_env.HOME }}"
      - "Backup base : {{ backup_base_dir }}"
  tags: [check]

- name: "Check | Docker CLI"
  ansible.builtin.command: docker version --format '{{ "{{.Client.Version}}" }}'
  changed_when: false
  tags: [check]

- name: "Check | WordPress container"
  ansible.builtin.command: docker inspect -f '{{ "{{.State.Running}}" }}' {{ wordpress_container }}
  register: wp_running
  changed_when: false
  failed_when: wp_running.stdout | trim != 'true'
  tags: [check]

- name: "Check | MySQL container"
  ansible.builtin.command: docker inspect -f '{{ "{{.State.Running}}" }}' {{ mysql_container }}
  register: db_running
  changed_when: false
  failed_when: db_running.stdout | trim != 'true'
  tags: [check]

- name: "Check | Ensure backup base is writable"
  ansible.builtin.file:
    path: "{{ backup_base_dir }}"
    state: directory
    mode: "0750"
  tags: [check]

- name: "Check | Write test file"
  ansible.builtin.copy:
    content: "ok\n"
    dest: "{{ backup_base_dir }}/.ansible_write_test"
    mode: "0600"
  tags: [check]

- name: "Check | Remove test file"
  ansible.builtin.file:
    path: "{{ backup_base_dir }}/.ansible_write_test"
    state: absent
  tags: [check]
