---
- name: "Backup Files | Create backup directory"
  ansible.builtin.file:
    path: "{{ backup_files_dir }}"
    state: directory
    mode: "0750"
  tags: [backup_files, backup_full]

- name: "Backup Files | Define backup file"
  ansible.builtin.set_fact:
    backup_files_filename: "wordpress_files_{{ backup_timestamp }}.tar.gz"
    backup_files_full_path: "{{ backup_files_dir }}/wordpress_files_{{ backup_timestamp }}.tar.gz"
  tags: [backup_files, backup_full]

- name: "Backup Files | Create archive inside WordPress container"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ wordpress_container }}"
      - tar
      - -czf
      - "/tmp/{{ backup_files_filename }}"
      - -C
      - "{{ wordpress_root }}"
      - .
  changed_when: true
  tags: [backup_files, backup_full]

- name: "Backup Files | Copy archive to VM"
  ansible.builtin.command:
    argv:
      - docker
      - cp
      - "{{ wordpress_container }}:/tmp/{{ backup_files_filename }}"
      - "{{ backup_files_full_path }}"
  changed_when: true
  tags: [backup_files, backup_full]

- name: "Backup Files | Remove temporary archive"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ wordpress_container }}"
      - rm
      - -f
      - "/tmp/{{ backup_files_filename }}"
  changed_when: true
  tags: [backup_files, backup_full]

- name: "Backup Files | Verify backup file"
  ansible.builtin.stat:
    path: "{{ backup_files_full_path }}"
  register: files_backup_stat
  tags: [backup_files, backup_full]

- name: "Backup Files | Validate backup"
  ansible.builtin.assert:
    that:
      - files_backup_stat.stat.exists
      - files_backup_stat.stat.size | int > 100
    fail_msg: "Le backup des fichiers WordPress n'a pas été créé correctement."
  tags: [backup_files, backup_full]

- name: "Backup Files | Result"
  ansible.builtin.debug:
    msg: "Backup fichiers créé : {{ backup_files_full_path }} ({{ files_backup_stat.stat.size }} octets)"
  tags: [backup_files, backup_full]
