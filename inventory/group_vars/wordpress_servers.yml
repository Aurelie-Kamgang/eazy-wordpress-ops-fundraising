---
# ============================================================
# CIBLE WORDPRESS
# ============================================================
wordpress_container: "eazy-wp-wordpress"
mysql_container: "eazy-wp-db"
wordpress_root: "/var/www/html"

# ============================================================
# BACKUPS
# Le chemin est calculé sur LA VM CIBLE, avec le HOME de
# l'utilisateur Ansible. En CLI et via Semaphore (ubuntu),
# cela donne normalement /home/ubuntu/wordpress-backups.
# ============================================================
backup_base_dir: "{{ ansible_env.HOME }}/wordpress-backups"
backup_db_dir: "{{ backup_base_dir }}/database"
backup_files_dir: "{{ backup_base_dir }}/files"

# ============================================================
# MISE A JOUR DE PLUGINS
# Modifier ici le plugin/la version dans le repo GitHub,
# puis lancer le tag update_plugins dans Semaphore.
# ============================================================
plugins_to_update:
  - name: "give"
    version: "latest"

# ============================================================
# RESTAURATION
# Mettre uniquement le NOM du fichier existant sur la VM.
# ============================================================
# restore_db_filename: ""
# restore_files_filename: ""
restore_db_filename: "wordpress_db_20261016T075621.sql"
restore_files_filename: "wordpress_files_20261016T075800.tar.gz"

# Protection restauration. Passer à true uniquement le temps
# de l'opération de restauration, puis revenir à false.
# restore_confirm: false
restore_confirm: true
