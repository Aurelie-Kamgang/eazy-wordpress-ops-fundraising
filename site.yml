---
- name: "EAZYTraining - WordPress Ops"
  hosts: wordpress_servers
  #become: true
  gather_facts: true
  pre_tasks:
  
    - name: "DEBUG | Version du projet"
      ansible.builtin.debug:
        msg: "VERSION SEMAPHORE TEST 2026-10-16-01"
      tags:
        - always

    - name: "Check execution mode"
      ansible.builtin.debug:
        msg: "ansible_check_mode = {{ ansible_check_mode }}"
      tags:
        - always
  
    - name: Refuser le mode Dry Run pour les opérations WordPress
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
        fail_msg: >
          Ce playbook ne doit pas être lancé en Dry Run (--check).
          Désactive Dry Run dans Semaphore.
        tags:
          - always
  roles:
    - wordpress_ops
